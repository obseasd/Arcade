name: keeper-cron

# Manual fallback ONLY. The live keeper scheduler is cron-job.org (the
# "arcade-keeper" job hitting https://www.arcade.trading/api/keeper/cron every
# ~2 min, running green). This GitHub Actions schedule was a redundant second
# trigger whose repo secret drifted out of sync with Vercel, so every 5-min tick
# returned 401 {"error":"Unauthorized"} and emailed a failure -- 469 red runs
# since early August, zero functional impact (cron-job.org was doing the work).
#
# The schedule is therefore DISABLED; only manual dispatch remains, as an
# emergency backup. NOTE: to make a manual run actually authenticate you must
# first realign the bearer -- the route accepts KEEPER_CRON_SECRET or
# COMPOUNDER_CRON_SECRET; set one of them identically in BOTH the Vercel env and
# the GitHub repo secret. Until then a manual dispatch will also 401.
#
# The route at /api/keeper/cron is POST + Bearer auth (Vercel's native GET cron
# cannot call it), which is why an external POST scheduler drives it.
on:
  # schedule DISABLED on purpose (see above). cron-job.org is the live trigger.
  # To re-enable a GitHub-side schedule, uncomment below AND fix the secret.
  #   schedule:
  #     - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Never run two ticks at once (a fill signs on a shared nonce).
concurrency:
  group: keeper-cron
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/keeper/cron
        env:
          COMPOUNDER_CRON_URL: ${{ secrets.COMPOUNDER_CRON_URL }}
          KEEPER_SECRET: ${{ secrets.COMPOUNDER_CRON_SECRET }}
        run: |
          if [ -z "$COMPOUNDER_CRON_URL" ] || [ -z "$KEEPER_SECRET" ]; then
            echo "Missing COMPOUNDER_CRON_URL or COMPOUNDER_CRON_SECRET repo secret" >&2
            exit 1
          fi
          # Reuse the compounder's origin (proven-good host) and hit the keeper
          # route on it. Strips everything after the scheme+host.
          ORIGIN="$(printf '%s' "$COMPOUNDER_CRON_URL" | sed -E 's#(https?://[^/]+).*#\1#')"
          KEEPER_URL="$ORIGIN/api/keeper/cron"
          echo "Keeper URL: $KEEPER_URL"
          curl -sS -X POST "$KEEPER_URL" \
            -H "Authorization: Bearer $KEEPER_SECRET" \
            -H "content-type: application/json" \
            --max-time 90 --fail-with-body
